name: ci

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-test-lint:
    name: Build + unit tests + lint (JDK 17, API 34)
    runs-on: ubuntu-latest
    # Round-32c (owner 4): bounded jobs — a stuck assemble returns a red X
    # with the exact task name instead of riding to the 6h cap. 25 min
    # (r32c) killed run 36100971988 MID-ASSEMBLE at 25:08 with the 60 s
    # HTTP timeouts never tripped: first-ever cold fetch of the full graph
    # + ~200 MB ORT AAR (cache restore failing all day) is SLOW, not hung.
    # 60 min (run 36102908317) capped the same way at 60:08, cache-save
    # completing — still no failure signature. Round-32d budget test:
    # 120 min distinguishes "genuinely slow cold build" from "stuck";
    # warm-cache builds are ~5.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/build.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee /tmp/test.log

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace lintDebug 2>&1 | tee /tmp/lint.log

      # Agent verification loop: CI failures are posted as commit comments so
      # the coding agent (egress-restricted to github.com) can read compiler
      # output and iterate.
      - name: Report failure to commit comments
        if: failure()
        run: |
          : > /tmp/errors.txt
          for f in /tmp/build.log /tmp/test.log /tmp/lint.log; do
            if [ -f "$f" ]; then
              grep -aE "^[e]: |error:|Error:|FAILURE|What went wrong|Caused by:|Task .* FAILED|Unresolved reference|Could not (resolve|find|get)|Execution failed|Lint found|> .* FAILED" "$f" >> /tmp/errors.txt || true
            fi
          done
          # JUnit XML failure messages + first stack frames (assertion text).
          {
            find . -path "*/test-results/*" -name "*.xml" 2>/dev/null | while read -r x; do
              echo "=== $x ==="
              grep -aoE '<testcase name="[^"]*"[^>]*>' "$x" | head -20
              grep -aoE '<failure message="[^"]*"' "$x" | head -20
              grep -aoE 'at com\.vcamstudio\.[^<"]*' "$x" | head -10
            done
          } >> /tmp/errors.txt
          {
            echo "CI failure report for run ${{ github.run_id }} (${GITHUB_WORKFLOW})"
            echo ""
            head -c 60000 /tmp/errors.txt
          } > /tmp/body.txt
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/body.txt --jq '.html_url' || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload test & lint reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vcam-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Round-20 mandate 1: the standalone wedge probe APK (separate app,
      # com.vcamstudio.probe) — install from a FRESH uninstall, run BEFORE
      # judging the studio engine.
      - name: Upload probe-wedge APK
        uses: actions/upload-artifact@v4
        with:
          name: probe-wedge-debug-apk
          path: probe-wedge/build/outputs/apk/debug/*.apk
          if-no-files-found: error
