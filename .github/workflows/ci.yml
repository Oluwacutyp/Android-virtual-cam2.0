name: ci

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # Round-34 (owner mandate 1): SPLIT JOBS. :app and :probe-wedge each get
  # their own runner — if :app is the stall it now has the entire 6-hour
  # budget without blocking the probe build, and the two log streams are
  # separate. Unit tests + lint are SUSPENDED for this diagnostic round;
  # they return once the :app stall is resolved (the golden ST harness runs
  # there — do not forget to restore).
  build-app:
    name: :app assemble (bisection)
    runs-on: ubuntu-latest
    # Round-35: back to 120 — the three build steps carry their own 15-min
    # step timeouts, so a stall is named by STEP in <=15 min.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache try)
        uses: gradle/actions/setup-gradle@v3

      # Round-40 note: vendored AAR DISABLED for compilation — an AAR passed
      # via files(...) contributes no classes to the compile classpath (run
      # 36239951521: ai.onnxruntime.* unresolved). Maven ORT 1.20.0 is the
      # compiling path; revisit vendoring with jar-extraction + natives if
      # Maven egress ever proves slow.

      # Round-34 (owner mandate 3): cache-independent network probe. Not
      # wired into the build — it measures whether services.gradle.org can
      # deliver ~130 MB quickly on this runner. Fast (~10 s) = egress is
      # fine and the stall is gradle-internal; hangs = the whole runner
      # network path is degraded and we have the answer immediately.
      - name: Warm gradle dist from release
        run: |
          mkdir -p ~/gradle-warm
          time curl -L --fail --retry 3 \
            -o ~/gradle-warm/gradle-8.9-bin.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip || true

      # Round-35 (owner fix 4): STEP-LEVEL BISECTION. Three gradle
      # invocations, 15-min step timeouts each — a stall is attributed to
      # Compile / Dex / Package by name. -i keeps the live task lines.
      - name: Compile
        timeout-minutes: 30
        run: |
          set -o pipefail
          echo "=== MEMORY BEFORE ==="
          free -m
          echo "=== /proc/meminfo OOM hints ==="
          grep -iE 'oom|avail' /proc/meminfo || true
          ./gradlew :app:compileDebugKotlin -i --console=plain 2>&1 | tee /tmp/compile.log
          EXIT=$?
          echo "=== MEMORY AFTER ==="
          free -m
          echo "=== KERNEL OOM CHECK ==="
          (dmesg 2>/dev/null || sudo dmesg 2>/dev/null) | tail -100 | grep -iE 'oom|killed process' || echo "(dmesg unavailable)"
          exit $EXIT

      - name: Dex
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew :app:mergeLibDexDebug :app:mergeProjectDexDebug :app:dexBuilderDebug -i --console=plain 2>&1 | tee /tmp/dex.log

      - name: Package
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew :app:packageDebug -i --console=plain 2>&1 | tee /tmp/package.log

      # Native payload audit: proves whether the ABI excludes actually
      # shrank merged_native_libs (the files(...) AAR bypasses abiFilters).
      - name: Measure native payload
        if: always()
        run: |
          D=app/build/intermediates/merged_native_libs
          if [ -d "$D" ]; then
            find "$D" -name '*.so' -printf '%s %p\n' | sort -rn | head -20
            echo "---- TOTAL bytes ----"
            find "$D" -name '*.so' -printf '%s\n' | awk '{s+=$1} END {print s}'
            echo "---- ABI dirs present ----"
            find "$D" -maxdepth 3 -type d
          else
            echo "merged_native_libs not present — build did not reach native merge"
          fi

      # Agent verification loop: CI failures are posted as commit comments.
      - name: Report failure to commit comments
        if: failure()
        run: |
          : > /tmp/errors.txt
          for f in /tmp/compile.log /tmp/dex.log /tmp/package.log; do
            if [ -f "$f" ]; then
              grep -aE "^[e]: |error:|Error:|FAILURE|What went wrong|Caused by:|Task .* FAILED|Unresolved reference|Could not (resolve|find|get)|Execution failed|> .* FAILED" "$f" >> /tmp/errors.txt || true
            fi
          done
          {
            echo "CI failure report for run ${{ github.run_id }} (${GITHUB_WORKFLOW})"
            echo ""
            head -c 60000 /tmp/errors.txt
          } > /tmp/body.txt
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/body.txt --jq '.html_url' || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vcam-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  build-probe:
    name: :probe-wedge assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble probe
        run: |
          set -o pipefail
          ./gradlew :probe-wedge:assembleDebug --console=plain 2>&1 | tee /tmp/probe.log

      - name: Report failure to commit comments
        if: failure()
        run: |
          : > /tmp/errors.txt
          if [ -f /tmp/probe.log ]; then
            grep -aE "^[e]: |error:|Error:|FAILURE|What went wrong|Caused by:|Task .* FAILED|Unresolved reference|Could not (resolve|find|get)|Execution failed|> .* FAILED" /tmp/probe.log >> /tmp/errors.txt || true
          fi
          {
            echo "CI failure report (probe job) for run ${{ github.run_id }} (${GITHUB_WORKFLOW})"
            echo ""
            head -c 60000 /tmp/errors.txt
          } > /tmp/body.txt
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/body.txt --jq '.html_url' || true
        env:
          GH_TOKEN: ${{ github.token }}

      # Round-20 mandate 1: standalone wedge probe APK (com.vcamstudio.probe)
      # — install from a FRESH uninstall, run BEFORE judging the studio engine.
      - name: Upload probe-wedge APK
        uses: actions/upload-artifact@v4
        with:
          name: probe-wedge-debug-apk
          path: probe-wedge/build/outputs/apk/debug/*.apk
          if-no-files-found: error
