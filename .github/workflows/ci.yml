name: ci

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # Round-34 (owner mandate 1): SPLIT JOBS. :app and :probe-wedge each get
  # their own runner — if :app is the stall it now has the entire 6-hour
  # budget without blocking the probe build, and the two log streams are
  # separate. Unit tests + lint are SUSPENDED for this diagnostic round;
  # they return once the :app stall is resolved (the golden ST harness runs
  # there — do not forget to restore).
  build-app:
    name: :app assemble (diagnostic, live task log)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache try)
        uses: gradle/actions/setup-gradle@v3

      # Round-33: vendored ORT AAR from this repo's release (GitHub CDN).
      - name: Fetch vendored ORT AAR
        run: |
          mkdir -p libs
          curl -L --fail --retry 3 \
            -o libs/ort.aar \
            https://github.com/Oluwacutyp/Android-virtual-cam2.0/releases/download/vendor-ort-1.20.0/ort.aar

      # Round-34 (owner mandate 3): cache-independent network probe. Not
      # wired into the build — it measures whether services.gradle.org can
      # deliver ~130 MB quickly on this runner. Fast (~10 s) = egress is
      # fine and the stall is gradle-internal; hangs = the whole runner
      # network path is degraded and we have the answer immediately.
      - name: Warm gradle dist from release
        run: |
          mkdir -p ~/gradle-warm
          time curl -L --fail --retry 3 \
            -o ~/gradle-warm/gradle-8.9-bin.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip || true

      # Round-34 (owner mandate 2): -i prints a timestamped line per task
      # start; the last line before any cancel NAMES the stalled task
      # (--profile was removed — it writes nothing on killed builds).
      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug -i --console=plain 2>&1 | tee /tmp/build.log

      # Agent verification loop: CI failures are posted as commit comments.
      - name: Report failure to commit comments
        if: failure()
        run: |
          : > /tmp/errors.txt
          if [ -f /tmp/build.log ]; then
            grep -aE "^[e]: |error:|Error:|FAILURE|What went wrong|Caused by:|Task .* FAILED|Unresolved reference|Could not (resolve|find|get)|Execution failed|> .* FAILED" /tmp/build.log >> /tmp/errors.txt || true
          fi
          {
            echo "CI failure report for run ${{ github.run_id }} (${GITHUB_WORKFLOW})"
            echo ""
            head -c 60000 /tmp/errors.txt
          } > /tmp/body.txt
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/body.txt --jq '.html_url' || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vcam-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  build-probe:
    name: :probe-wedge assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble probe
        run: |
          set -o pipefail
          ./gradlew :probe-wedge:assembleDebug --console=plain 2>&1 | tee /tmp/probe.log

      - name: Report failure to commit comments
        if: failure()
        run: |
          : > /tmp/errors.txt
          if [ -f /tmp/probe.log ]; then
            grep -aE "^[e]: |error:|Error:|FAILURE|What went wrong|Caused by:|Task .* FAILED|Unresolved reference|Could not (resolve|find|get)|Execution failed|> .* FAILED" /tmp/probe.log >> /tmp/errors.txt || true
          fi
          {
            echo "CI failure report (probe job) for run ${{ github.run_id }} (${GITHUB_WORKFLOW})"
            echo ""
            head -c 60000 /tmp/errors.txt
          } > /tmp/body.txt
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/body.txt --jq '.html_url' || true
        env:
          GH_TOKEN: ${{ github.token }}

      # Round-20 mandate 1: standalone wedge probe APK (com.vcamstudio.probe)
      # — install from a FRESH uninstall, run BEFORE judging the studio engine.
      - name: Upload probe-wedge APK
        uses: actions/upload-artifact@v4
        with:
          name: probe-wedge-debug-apk
          path: probe-wedge/build/outputs/apk/debug/*.apk
          if-no-files-found: error
