name: ci

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-test-lint:
    name: Build + unit tests + lint (JDK 17, API 34)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/build.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee /tmp/test.log

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace lintDebug 2>&1 | tee /tmp/lint.log

      # Sandbox verification path: CI failures are posted as commit comments so
      # the agent (restricted to github.com/api.github.com egress) can read the
      # compiler output and iterate.
      - name: Report failure to commit comments
        if: failure()
        run: |
          BODY=$( (for f in /tmp/build.log /tmp/test.log /tmp/lint.log; do
                    [ -f "$f" ] && grep -aE "^[e>w]: |error:|FAILURE|What went wrong|Caused by:|> Task .+FAILED|Unresolved|unable to|Could not" "$f"
                  done) | head -c 60000 )
          if [ -n "$BODY" ]; then
            gh api repos/"${{ github.repository }}"/commits/"${{ github.sha }}"/comments \
              -f body="CI failure report for run ${{ github.run_id }}:
\`\`\`
$BODY
\`\`\`" --jq '.html_url' || true
          else
            gh api repos/"${{ github.repository }}"/commits/"${{ github.sha }}"/comments \
              -f body="CI run ${{ github.run_id }} failed but no recognizable error lines were captured. Check reports artifact." || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload test & lint reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vcam-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
