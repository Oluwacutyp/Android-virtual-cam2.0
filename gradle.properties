# Round-36 (owner): MEMORY PRESSURE. The r35 log shows the gradle JVM DIED
# mid-Compile (AAPT2 daemons shut down = parent exit; runner sat on the
# corpse for 15 min). Kernel OOM-kill on a ~7 GB runner is the prime
# suspect: -Xmx4g + Kotlin daemon + AAPT2 daemons + OS. Heap down to 2g,
# Kotlin compiles IN-PROCESS (no separate Kotlin daemon process, ~2 GB
# saved), incremental off (removes ~200 MB of cacheable state). No heap
# dump appeared because HeapDumpOnOutOfMemoryError only fires on the JVM's
# own -Xmx limit, not a kernel kill.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

kotlin.code.style=official

# Round-32b (owner B.3): fail fast on stalled dependency fetches instead of
# hanging the CI step for hours. A stuck transfer now throws after 60 s and
# the run ends with a real error message (posted to commit comments).
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
