# Round-35 (owner fix 2): fixed heap + NO DAEMON. The r34 log shows tasks
# PROGRESSING (mergeExtDexDebug stored its cache entry, AAPT2 daemons shut
# down) when the 6h cancel hit — with a daemon alive, a finished build can
# still hang the step forever (the daemon inherits the stdio pipe and tee
# never sees EOF), and an OOM'd daemon leaves the runner waiting on a dead
# process. Without a daemon the JVM exits and the step fails loudly.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

kotlin.code.style=official

# Round-32b (owner B.3): fail fast on stalled dependency fetches instead of
# hanging the CI step for hours. A stuck transfer now throws after 60 s and
# the run ends with a real error message (posted to commit comments).
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
